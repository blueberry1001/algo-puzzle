<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650"><rect width="1000" height="650" fill="#efe9dd"/><rect x="90" y="60" width="820" height="530" fill="#faf7ef"/><path d="M130 170H870M130 230H870M130 290H870M130 350H870M130 410H870M130 470H870" stroke="#dcd8cb"/><text x="150" y="140" font-family="serif" font-size="24" fill="#817a6a">余韻ノート　/　あの夜の記録</text><text x="150" y="270" font-family="serif" font-size="46" fill="#484738">りんご。そして、みかん。</text><text x="150" y="390" font-family="serif" font-size="29" fill="#666554">19時、窓ぎわで。</text><text x="150" y="510" font-family="serif" font-size="22" fill="#817a6a">小さな光をつないだら、星座になる。</text></svg>
