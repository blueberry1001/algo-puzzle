<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#25354d"><meta name="robots" content="noindex,nofollow"><title>ハルとのトーク | TALK</title><link rel="icon" href="assets/talk.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/style.css"><script type="module" src="assets/chat.js"></script></head>
<body class="chat-page">
  <main class="chat-shell" aria-label="ハルとのトーク">
    <header class="chat-header"><a href="sns/" class="icon-button back-link" aria-label="ハルの記録を開く"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m14 6-6 6 6 6M8 12h13"/></svg></a><span class="avatar talk-avatar">a</span><div class="contact"><h1>ハル</h1><span><i></i>オンライン</span></div><span class="talk-wordmark">TALK</span></header>
    <div id="notice" class="notice" role="alert" hidden></div>
    <section id="conversation" class="conversation" aria-label="会話履歴" role="log" aria-live="polite" aria-relevant="additions"></section>
    <footer class="composer-area"><form id="message-form" class="composer"><label class="sr-only" for="message">メッセージ</label><input id="message" name="message" placeholder="メッセージを入力" maxlength="500" autocomplete="off" enterkeyhint="send" required><button id="send" type="submit" class="send-button" aria-label="送信" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 4 16 8-16 8 3-8-3-8Zm3 8h13"/></svg></button></form><button id="reset" class="reset-button" type="button">進捗をリセットする</button></footer>
  </main>
  <dialog id="reset-dialog"><form method="dialog"><span class="dialog-kicker">TALK</span><h2>最初からやり直しますか？</h2><p>会話履歴とSNSの進捗がリセットされます。</p><div class="dialog-actions"><button value="cancel" autofocus>キャンセル</button><button value="reset" class="confirm-reset">リセットする</button></div></form></dialog>
  <noscript>このサイトを利用するにはJavaScriptを有効にしてください。</noscript>
</body></html>
